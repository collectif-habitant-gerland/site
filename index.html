<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Collectif des habitants de Gerland</title>
  <style>
    :root { --fond: #f6f7f4; --texte: #1f2a24; --accent: #2f7d4f; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--fond); color: var(--texte);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 16px; box-sizing: border-box; text-align: center;
    }
    h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0 0 .5rem; color: var(--accent); }
    p { font-size: 1.1rem; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Collectif des habitants de Gerland</h1>
    <p>Site en construction.</p>
  </main>
</body>
</html>
